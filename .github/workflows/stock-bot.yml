name: 개별종목 추천 봇

on:
  schedule:
    # GitHub 예약은 30분~1시간씩 늦게 시작할 때가 많아서:
    #  ① 같은 일을 30분 간격으로 두 번 예약 → 먼저 시작한 쪽이 알림을 보내고, 나중 쪽은 화면만 새로 만들어요
    #  ② 너무 일찍 시작하면 마감 가격이 확정될 때까지 기다렸다가 계산해요
    # 한국시간 화~토 오전 6시 17분·47분 — 아침 추천 (미국장 마감 뒤)
    - cron: "17 21 * * 1-5"
    - cron: "47 21 * * 1-5"
    # 한국시간 월~금 오후 3시 41분·4시 11분 — 한국장(3시 30분) 마감 뒤
    - cron: "41 6 * * 1-5"
    - cron: "11 7 * * 1-5"
  workflow_dispatch:      # Actions 화면에서 "Run workflow" 버튼으로 바로 실행
    inputs:
      close_market:
        description: "장 마감 알림을 다시 받으려면 나라를 고르세요 (비우면 아침 추천 알림)"
        required: false
        default: ""
        type: choice
        options: ["", "KR", "CN", "HK"]
  push:                   # 종목 목록이나 코드를 고치면 바로 한 번 실행
    branches: [main]
    paths: ["stock_bot.py", "newscard.py", "requirements.txt", "stocks.csv", "reasons.json", "crosscheck.py", ".github/workflows/stock-bot.yml", "pricecache.py"]

concurrency:            # 여러 번 겹쳐 실행되면 차례로 (저장할 때 부딪히지 않게)
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 먼저 끝난 실행이 남긴 '알림 보냄' 기록까지 받기

      - name: 이번 실행이 할 일 정하기
        id: plan
        run: |
          S="${{ github.event.schedule }}"
          M="${{ inputs.close_market }}"; NB=""; KEY=""
          case "$S" in
            "17 21 * * 1-5"|"47 21 * * 1-5") M=""; NB="06:30"; KEY="morning";;
            "41 6 * * 1-5"|"11 7 * * 1-5") M="KR"; NB="15:45"; KEY="KR";;
          esac
          D=$(TZ=Asia/Seoul date +%F)
          SKIP=""
          if [ -n "$KEY" ] && grep -qx "$D $KEY" docs/alerts_sent.txt 2>/dev/null; then
            SKIP=1; echo "오늘 '$KEY' 알림은 먼저 시작한 실행이 이미 보냈어요 → 이번엔 화면만 새로 만들어요"
          fi
          echo "market=$M" >> "$GITHUB_OUTPUT"; echo "not_before=$NB" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"; echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 받아 둔 가격 불러오기 (최근 1달만 새로 받아서 빠르게)
        uses: actions/cache@v4
        with:
          path: .pricecache
          key: prices-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: prices-

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 너무 일찍 시작했으면 마감 가격이 나올 때까지 기다리기
        if: steps.plan.outputs.not_before != '' && steps.plan.outputs.skip != '1'
        run: |
          T=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) ${{ steps.plan.outputs.not_before }}" +%s)
          N=$(date +%s)
          if [ "$N" -lt "$T" ]; then echo "$((T-N))초 기다려요"; sleep $((T-N)); else echo "기다릴 필요 없어요"; fi

      - name: 종목 분석 + 휴대폰 알림
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLOSE_MARKET: ${{ steps.plan.outputs.market }}
          SKIP_ALERT: ${{ steps.plan.outputs.skip }}
        run: python stock_bot.py

      - name: 알림 보낸 기록 남기기 (같은 알림을 두 번 보내지 않게)
        if: steps.plan.outputs.key != '' && steps.plan.outputs.skip != '1'
        run: |
          echo "$(TZ=Asia/Seoul date +%F) ${{ steps.plan.outputs.key }}" >> docs/alerts_sent.txt
          tail -n 60 docs/alerts_sent.txt > /tmp/a && mv /tmp/a docs/alerts_sent.txt

      - name: 대시보드 저장
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add docs
          git commit -m "개별종목 대시보드 업데이트 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git pull --rebase -X theirs origin main && git push
