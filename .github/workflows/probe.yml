name: 임시 점검
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - run: |
          echo '[{"title":"시험","message":"1. 시험 +1%","click_url":"u"}]' > .pending_alerts.json
          python send_later.py stock_bot
