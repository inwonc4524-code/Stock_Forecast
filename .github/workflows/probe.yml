name: 임시 점검
on:
  push:
    branches: [main]
    paths: [probe.py, .github/workflows/probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - run: python probe.py
